<div class="modal">
  <div class="modal-top">
    <button (click)="closed.emit()">Done</button>
    <span>Edit Page</span>
    <span></span>
  </div>

  <div class="preview">
    <img [src]="page.dataUrl" [alt]="page.name"
         [style.transform]="'rotate(' + page.rotation + 'deg)'" />
  </div>

  <div class="tools">
    <button class="tool-btn" (click)="rotate(-90)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="1 4 1 10 7 10"/>
        <path d="M3.51 15a9 9 0 1 0 .49-3.53"/>
      </svg>
      Rotate Left
    </button>
    <button class="tool-btn" (click)="rotate(90)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-.49-3.53"/>
      </svg>
      Rotate Right
    </button>
  </div>
</div>
