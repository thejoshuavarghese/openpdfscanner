<div class="modal open">
  <div class="modal-top">
    <button (click)="cancelled.emit()">Cancel</button>
    <span>Crop</span>
    <button (click)="applyCrop()" [disabled]="applying">
      {{ applying ? 'Processing…' : 'Apply' }}
    </button>
  </div>

  <div class="canvas-wrap">
    <canvas #scanCanvas
      (mousedown)="onPointerDown($event)"
      (mousemove)="onPointerMove($event)"
      (mouseup)="onPointerUp()"
      (touchstart)="onPointerDown($event)"
      (touchmove)="onPointerMove($event)"
      (touchend)="onPointerUp()"
    ></canvas>
  </div>

  @if (status) {
    <div class="status">{{ status }}</div>
  }

  <div class="tools">
    <button class="tool-btn" (click)="autoDetect()" [disabled]="detecting">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      {{ detecting ? 'Detecting…' : 'Auto-detect' }}
    </button>
    <button class="tool-btn" (click)="resetCorners()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="1 4 1 10 7 10"/>
        <path d="M3.51 15a9 9 0 1 0 .49-3.53"/>
      </svg>
      Reset
    </button>
  </div>
</div>
