<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Open PDF Scanner — Christ is Lord</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
  :root{
    --bg:#0f1115;
    --panel:#171a21;
    --panel2:#1f232c;
    --accent:#4f8cff;
    --accent2:#6fd0a0;
    --text:#eef1f6;
    --muted:#9aa3b2;
    --danger:#ff6161;
    --border:#2a2f3a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding-bottom:100px;
  }
  header{
    padding:20px 16px 14px;
    text-align:center;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, #14161c, #0f1115);
  }
  header h1{
    margin:0;
    font-size:22px;
    font-weight:700;
    letter-spacing:-0.02em;
  }
  header h1 span{color:var(--accent);}
  header p{
    margin:6px 0 0;
    color:var(--muted);
    font-size:13px;
  }
  .container{
    max-width:640px;
    margin:0 auto;
    padding:16px;
  }
  .actions{
    display:flex;
    gap:10px;
    margin-bottom:18px;
  }
  .btn{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:16px 8px;
    border-radius:14px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:transform .1s ease, background .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:scale(0.96);}
  .btn.primary{
    background:linear-gradient(135deg, var(--accent), #3a6fe0);
    border-color:transparent;
  }
  .btn svg{width:22px;height:22px;}
  #emptyState{
    text-align:center;
    color:var(--muted);
    padding:60px 20px;
    border:2px dashed var(--border);
    border-radius:16px;
    font-size:14px;
  }
  #emptyState svg{width:48px;height:48px;opacity:.4;margin-bottom:10px;}
  #pageList{
    list-style:none;
    padding:0;
    margin:0;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .page-item{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:10px;
  }
  .page-item.sortable-ghost{opacity:0.3;}
  .drag-handle{
    color:var(--muted);
    cursor:grab;
    padding:4px;
    touch-action:none;
    flex-shrink:0;
  }
  .drag-handle svg{width:20px;height:20px;display:block;}
  .thumb-wrap{
    position:relative;
    width:64px;
    height:64px;
    flex-shrink:0;
    border-radius:8px;
    overflow:hidden;
    background:#000;
  }
  .thumb-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .page-info{
    flex:1;
    min-width:0;
  }
  .page-info .name{
    font-size:13px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .page-info .idx{
    font-size:11px;
    color:var(--muted);
    margin-top:2px;
  }
  .page-controls{
    display:flex;
    gap:4px;
    flex-shrink:0;
  }
  .icon-btn{
    width:34px;
    height:34px;
    border-radius:9px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .icon-btn svg{width:16px;height:16px;}
  .icon-btn.danger{color:var(--danger);}
  .icon-btn:active{transform:scale(0.9);}

  #bottomBar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:var(--panel);
    border-top:1px solid var(--border);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex;
    gap:10px;
    max-width:640px;
    margin:0 auto;
  }
  #bottomBar.hidden{display:none;}
  #bottomBar .btn{padding:14px 8px;flex-direction:row;}
  #clearBtn{
    background:var(--panel2);
    flex:0 0 auto;
    width:52px;
  }
  #exportBtn{
    flex:1;
  }
  input[type=file]{display:none;}

  .toast{
    position:fixed;
    top:14px;
    left:50%;
    transform:translateX(-50%);
    background:#20242e;
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 18px;
    border-radius:10px;
    font-size:13px;
    box-shadow:0 6px 20px rgba(0,0,0,.4);
    z-index:999;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, top .2s ease;
  }
  .toast.show{
    opacity:1;
    top:20px;
  }

  /* Editor modal */
  #editorModal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    display:none;
    flex-direction:column;
    z-index:1000;
  }
  #editorModal.open{display:flex;}
  #editorTop{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 16px;
    color:var(--text);
  }
  #editorTop button{
    background:none;
    border:none;
    color:var(--accent);
    font-size:15px;
    font-weight:600;
    padding:8px;
  }
  #editorCanvasWrap{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:10px;
  }
  #editorCanvasWrap img{
    max-width:100%;
    max-height:100%;
    transition:transform .2s ease;
  }
  #editorTools{
    display:flex;
    justify-content:center;
    gap:16px;
    padding:16px;
  }
  #editorTools button{
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    width:48px;
    height:48px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #editorTools button svg{width:20px;height:20px;}
  footer{
    text-align:center;
    color:var(--muted);
    font-size:11px;
    padding:20px 16px 10px;
  }

  /* Scan/Crop editor */
  #scanModal{
    position:fixed;
    inset:0;
    background:#000;
    display:none;
    flex-direction:column;
    z-index:1100;
  }
  #scanModal.open{display:flex;}
  #scanTop{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 16px;
    color:var(--text);
    flex-shrink:0;
  }
  #scanTop button{
    background:none;
    border:none;
    color:var(--accent);
    font-size:15px;
    font-weight:600;
    padding:8px;
  }
  #scanTop .title{
    font-weight:600;
    color:var(--muted);
    font-size:13px;
  }
  #scanStageWrap{
    flex:1;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    touch-action:none;
  }
  #scanCanvasBox{
    position:relative;
    touch-action:none;
  }
  #scanCanvasBox canvas{
    display:block;
    max-width:100%;
    max-height:100%;
  }
  #scanSvgOverlay{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    touch-action:none;
  }
  #scanSvgOverlay polygon{
    fill:rgba(79,140,255,0.18);
    stroke:var(--accent);
    stroke-width:2;
    vector-effect:non-scaling-stroke;
  }
  .corner-handle{
    fill:var(--accent);
    stroke:#fff;
    stroke-width:2;
    vector-effect:non-scaling-stroke;
    cursor:grab;
    touch-action:none;
  }
  #scanBottom{
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    flex-shrink:0;
  }
  #scanBottom .row{
    display:flex;
    gap:10px;
  }
  #scanBottom .btn{
    flex:1;
    padding:14px 8px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    font-size:13px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  #scanBottom .btn svg{width:18px;height:18px;}
  #scanBottom .btn.primary{
    background:linear-gradient(135deg, var(--accent), #3a6fe0);
    border-color:transparent;
  }
  #scanBottom .btn.ghost{
    background:transparent;
  }
  #scanBottom .btn:disabled{
    opacity:0.5;
  }
  #scanStatus{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    min-height:16px;
  }
  .spinner{
    width:14px;height:14px;
    border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff;
    border-radius:50%;
    display:inline-block;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* preview after cropping */
  #reviewModal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    display:none;
    flex-direction:column;
    z-index:1150;
  }
  #reviewModal.open{display:flex;}
  #reviewTop{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 16px;
    color:var(--text);
    flex-shrink:0;
  }
  #reviewTop button{
    background:none;border:none;color:var(--accent);
    font-size:15px;font-weight:600;padding:8px;
  }
  #reviewImgWrap{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
    overflow:hidden;
  }
  #reviewImgWrap img{
    max-width:100%;
    max-height:100%;
    border-radius:6px;
  }
  #reviewBottom{
    display:flex;
    gap:10px;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  }
  #reviewBottom .btn{
    flex:1;
    padding:14px 8px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    font-weight:600;
    font-size:13px;
  }
  #reviewBottom .btn.primary{
    background:linear-gradient(135deg, var(--accent2), #3aa876);
    border-color:transparent;
  }
</style>
</head>
<body>

<header>
  <h1>Open<span>PDF</span>Scanner</h1>
  <p>Scan photos, reorder pages, export one PDF — all on your device</p>
</header>

<div class="container">
  <div class="actions">
    <label class="btn primary" for="cameraInput">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      Scan / Camera
    </label>
    <label class="btn" for="galleryInput">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      From Gallery
    </label>
  </div>

  <input type="file" id="cameraInput" accept="image/*" capture="environment">
  <input type="file" id="galleryInput" accept="image/*" multiple>

  <div id="emptyState">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
    <div>No pages yet.<br>Tap "Scan" or "From Gallery" to add your first page.</div>
  </div>

  <ul id="pageList"></ul>
</div>

<div id="bottomBar" class="hidden">
  <button class="icon-btn" id="clearBtn" title="Clear all">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
  </button>
  <button class="btn primary" id="exportBtn" style="border-radius:12px;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
    Export PDF (<span id="pageCount">0</span> pages)
  </button>
</div>

<footer>Everything happens locally in your browser. No uploads, no accounts.</footer>

<div class="toast" id="toast"></div>

<!-- Scan / Crop editor -->
<div id="scanModal">
  <div id="scanTop">
    <button id="scanCancel">Cancel</button>
    <span class="title">Adjust Corners</span>
    <button id="scanRotateSrc" title="Rotate source photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/></svg>
    </button>
  </div>
  <div id="scanStageWrap">
    <div id="scanCanvasBox">
      <canvas id="scanCanvas"></canvas>
      <svg id="scanSvgOverlay"></svg>
    </div>
  </div>
  <div id="scanStatus"></div>
  <div id="scanBottom">
    <div class="row">
      <button class="btn" id="autoDetectBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></svg>
        Auto Detect
      </button>
      <button class="btn ghost" id="resetCornersBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 4v5h5"/></svg>
        Reset
      </button>
    </div>
    <button class="btn primary" id="applyCropBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
      Flatten & Continue
    </button>
  </div>
</div>

<!-- Review cropped result -->
<div id="reviewModal">
  <div id="reviewTop">
    <button id="reviewBack">Back to Adjust</button>
    <span style="font-weight:600;">Preview</span>
    <button id="reviewAccept">Use This</button>
  </div>
  <div id="reviewImgWrap">
    <img id="reviewImg" src="" alt="Scanned preview">
  </div>
  <div id="reviewBottom">
    <button class="btn" id="reviewDiscard">Discard</button>
    <button class="btn primary" id="reviewAcceptBottom">Add Page</button>
  </div>
</div>

<!-- Simple editor: rotate / crop-free adjust -->
<div id="editorModal">
  <div id="editorTop">
    <button id="editorCancel">Cancel</button>
    <span style="font-weight:600;">Edit Page</span>
    <button id="editorDone">Done</button>
  </div>
  <div id="editorCanvasWrap">
    <img id="editorImg" src="" alt="">
  </div>
  <div id="editorTools">
    <button id="rotateLeftBtn" title="Rotate left">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
    </button>
    <button id="rotateRightBtn" title="Rotate right">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/></svg>
    </button>
  </div>
</div>

<script>
(function(){
  const pageList = document.getElementById('pageList');
  const emptyState = document.getElementById('emptyState');
  const bottomBar = document.getElementById('bottomBar');
  const pageCountEl = document.getElementById('pageCount');
  const toast = document.getElementById('toast');
  const cameraInput = document.getElementById('cameraInput');
  const galleryInput = document.getElementById('galleryInput');

  // Each page: { id, dataUrl, rotation }
  let pages = [];
  let idCounter = 0;
  let editingId = null;

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(()=> toast.classList.remove('show'), 1800);
  }

  function fileToDataUrl(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // Queue of raw files waiting to go through the scan/crop flow one at a time
  let scanQueue = [];

  async function addFiles(fileList){
    const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
    if(!files.length) return;
    scanQueue.push(...files);
    processNextInQueue();
  }

  function processNextInQueue(){
    if(scanQueue.length === 0) return;
    const file = scanQueue.shift();
    fileToDataUrl(file).then(dataUrl => openScanEditor(dataUrl, file.name || 'Photo'));
  }

  cameraInput.addEventListener('change', (e)=>{
    addFiles(e.target.files);
    e.target.value = '';
  });
  galleryInput.addEventListener('change', (e)=>{
    addFiles(e.target.files);
    e.target.value = '';
  });

  function render(){
    pageList.innerHTML = '';
    if(pages.length === 0){
      emptyState.style.display = 'block';
      bottomBar.classList.add('hidden');
      return;
    }
    emptyState.style.display = 'none';
    bottomBar.classList.remove('hidden');
    pageCountEl.textContent = pages.length;

    pages.forEach((page, index) => {
      const li = document.createElement('li');
      li.className = 'page-item';
      li.dataset.id = page.id;
      li.innerHTML = `
        <span class="drag-handle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="6" r="1.2"/><circle cx="9" cy="12" r="1.2"/><circle cx="9" cy="18" r="1.2"/><circle cx="15" cy="6" r="1.2"/><circle cx="15" cy="12" r="1.2"/><circle cx="15" cy="18" r="1.2"/></svg>
        </span>
        <div class="thumb-wrap">
          <img src="${page.dataUrl}" style="transform:rotate(${page.rotation}deg);" alt="page thumbnail">
        </div>
        <div class="page-info">
          <div class="name">${page.name}</div>
          <div class="idx">Page ${index+1}</div>
        </div>
        <div class="page-controls">
          <button class="icon-btn" data-action="edit" title="Rotate/Edit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          </button>
          <button class="icon-btn danger" data-action="delete" title="Delete">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          </button>
        </div>
      `;
      pageList.appendChild(li);
    });
  }

  pageList.addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-action]');
    if(!btn) return;
    const li = e.target.closest('.page-item');
    const id = Number(li.dataset.id);
    const action = btn.dataset.action;
    if(action === 'delete'){
      pages = pages.filter(p => p.id !== id);
      render();
      showToast('Page removed');
    } else if(action === 'edit'){
      openEditor(id);
    }
  });

  new Sortable(pageList, {
    handle: '.drag-handle',
    animation: 180,
    onEnd: function(evt){
      const moved = pages.splice(evt.oldIndex, 1)[0];
      pages.splice(evt.newIndex, 0, moved);
      render();
    }
  });

  // ---- Editor (rotate) ----
  const editorModal = document.getElementById('editorModal');
  const editorImg = document.getElementById('editorImg');
  let tempRotation = 0;

  function openEditor(id){
    editingId = id;
    const page = pages.find(p => p.id === id);
    if(!page) return;
    tempRotation = page.rotation;
    editorImg.src = page.dataUrl;
    editorImg.style.transform = `rotate(${tempRotation}deg)`;
    editorModal.classList.add('open');
  }

  document.getElementById('rotateLeftBtn').addEventListener('click', ()=>{
    tempRotation = (tempRotation - 90 + 360) % 360;
    editorImg.style.transform = `rotate(${tempRotation}deg)`;
  });
  document.getElementById('rotateRightBtn').addEventListener('click', ()=>{
    tempRotation = (tempRotation + 90) % 360;
    editorImg.style.transform = `rotate(${tempRotation}deg)`;
  });
  document.getElementById('editorCancel').addEventListener('click', ()=>{
    editorModal.classList.remove('open');
    editingId = null;
  });
  document.getElementById('editorDone').addEventListener('click', ()=>{
    const page = pages.find(p => p.id === editingId);
    if(page) page.rotation = tempRotation;
    editorModal.classList.remove('open');
    editingId = null;
    render();
  });

  // ---- Clear all ----
  document.getElementById('clearBtn').addEventListener('click', ()=>{
    if(pages.length === 0) return;
    if(confirm('Remove all pages?')){
      pages = [];
      render();
    }
  });

  // ---- Export to PDF ----
  function loadImage(src){
    return new Promise((resolve, reject)=>{
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  // Draw rotated image onto a canvas and return dataURL + dimensions
  async function getRotatedImageData(page){
    const img = await loadImage(page.dataUrl);
    const rotation = ((page.rotation % 360) + 360) % 360;
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    if(rotation === 90 || rotation === 270){
      canvas.width = img.height;
      canvas.height = img.width;
    } else {
      canvas.width = img.width;
      canvas.height = img.height;
    }

    ctx.save();
    ctx.translate(canvas.width/2, canvas.height/2);
    ctx.rotate(rotation * Math.PI/180);
    ctx.drawImage(img, -img.width/2, -img.height/2);
    ctx.restore();

    return {
      dataUrl: canvas.toDataURL('image/jpeg', 0.92),
      width: canvas.width,
      height: canvas.height
    };
  }

  document.getElementById('exportBtn').addEventListener('click', async ()=>{
    if(pages.length === 0) return;
    const exportBtn = document.getElementById('exportBtn');
    const originalHTML = exportBtn.innerHTML;
    exportBtn.innerHTML = 'Generating PDF...';
    exportBtn.style.opacity = '0.7';

    try{
      const { jsPDF } = window.jspdf;
      let pdf = null;

      for(let i = 0; i < pages.length; i++){
        const { dataUrl, width, height } = await getRotatedImageData(pages[i]);
        const orientation = width > height ? 'landscape' : 'portrait';

        // Convert pixel size to mm at 96 DPI-ish scale, using A4-fit logic instead:
        // We'll just size the PDF page to match image aspect ratio, fit into A4 max.
        const maxW = 210, maxH = 297; // A4 mm portrait
        let pdfW, pdfH;
        if(orientation === 'landscape'){
          pdfW = 297; pdfH = 210;
        } else {
          pdfW = 210; pdfH = 297;
        }

        if(i === 0){
          pdf = new jsPDF({ orientation, unit: 'mm', format: [pdfW, pdfH] });
        } else {
          pdf.addPage([pdfW, pdfH], orientation);
        }

        // Fit image within page while preserving aspect ratio
        const imgRatio = width / height;
        const pageRatio = pdfW / pdfH;
        let drawW, drawH;
        if(imgRatio > pageRatio){
          drawW = pdfW;
          drawH = pdfW / imgRatio;
        } else {
          drawH = pdfH;
          drawW = pdfH * imgRatio;
        }
        const offsetX = (pdfW - drawW) / 2;
        const offsetY = (pdfH - drawH) / 2;

        pdf.addImage(dataUrl, 'JPEG', offsetX, offsetY, drawW, drawH);
      }

      const filename = 'Snap2PDF_' + new Date().toISOString().slice(0,10) + '.pdf';
      pdf.save(filename);
      showToast('PDF downloaded!');
    }catch(err){
      console.error(err);
      showToast('Something went wrong, please try again');
    }finally{
      exportBtn.innerHTML = originalHTML;
      exportBtn.style.opacity = '1';
    }
  });

  // =========================================================
  // Scan / Crop Editor
  // =========================================================
  const scanModal = document.getElementById('scanModal');
  const scanCanvas = document.getElementById('scanCanvas');
  const scanCanvasBox = document.getElementById('scanCanvasBox');
  const scanSvgOverlay = document.getElementById('scanSvgOverlay');
  const scanStatus = document.getElementById('scanStatus');
  const autoDetectBtn = document.getElementById('autoDetectBtn');

  const reviewModal = document.getElementById('reviewModal');
  const reviewImg = document.getElementById('reviewImg');

  let scanImg = null;          // the loaded <img> for the current source photo
  let scanSourceRotation = 0;  // rotation applied to the whole source photo (0/90/180/270)
  let corners = [];            // array of 4 {x,y} in canvas-pixel space, order: TL, TR, BR, BL
  let currentScanName = 'Photo';
  let croppedResultDataUrl = null;
  let draggingCornerIdx = null;

  function openScanEditor(dataUrl, name){
    currentScanName = name;
    scanSourceRotation = 0;
    const img = new Image();
    img.onload = () => {
      scanImg = img;
      scanModal.classList.add('open');
      layoutScanCanvas();
      // Kick off OpenCV loading in the background so Auto Detect feels instant later
      waitForCv(20000).catch(()=>{ /* silent prewarm failure, handled on demand */ });
    };
    img.src = dataUrl;
  }

  function getRotatedSourceCanvas(){
    // Returns a canvas with scanImg drawn at scanSourceRotation applied
    const rot = ((scanSourceRotation % 360) + 360) % 360;
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    if(rot === 90 || rot === 270){
      c.width = scanImg.height;
      c.height = scanImg.width;
    } else {
      c.width = scanImg.width;
      c.height = scanImg.height;
    }
    ctx.save();
    ctx.translate(c.width/2, c.height/2);
    ctx.rotate(rot * Math.PI/180);
    ctx.drawImage(scanImg, -scanImg.width/2, -scanImg.height/2);
    ctx.restore();
    return c;
  }

  function layoutScanCanvas(){
    const src = getRotatedSourceCanvas();
    // Fit canvas into the available stage area, but keep internal resolution = source resolution
    scanCanvas.width = src.width;
    scanCanvas.height = src.height;
    const ctx = scanCanvas.getContext('2d');
    ctx.clearRect(0,0,scanCanvas.width, scanCanvas.height);
    ctx.drawImage(src, 0, 0);

    // Fit the display box within the wrapper while preserving aspect ratio
    const wrap = document.getElementById('scanStageWrap');
    const maxW = wrap.clientWidth - 20;
    const maxH = wrap.clientHeight - 20;
    const ratio = Math.min(maxW / src.width, maxH / src.height);
    const dispW = src.width * ratio;
    const dispH = src.height * ratio;
    scanCanvasBox.style.width = dispW + 'px';
    scanCanvasBox.style.height = dispH + 'px';
    scanCanvas.style.width = dispW + 'px';
    scanCanvas.style.height = dispH + 'px';
    scanSvgOverlay.setAttribute('viewBox', `0 0 ${src.width} ${src.height}`);

    resetCornersToDefault();
    drawOverlay();
  }

  function resetCornersToDefault(){
    const w = scanCanvas.width, h = scanCanvas.height;
    const insetX = w * 0.08, insetY = h * 0.08;
    corners = [
      { x: insetX, y: insetY },           // TL
      { x: w - insetX, y: insetY },       // TR
      { x: w - insetX, y: h - insetY },   // BR
      { x: insetX, y: h - insetY }        // BL
    ];
  }

  function drawOverlay(){
    scanSvgOverlay.innerHTML = '';
    const ns = 'http://www.w3.org/2000/svg';
    const poly = document.createElementNS(ns, 'polygon');
    poly.setAttribute('points', corners.map(c => `${c.x},${c.y}`).join(' '));
    scanSvgOverlay.appendChild(poly);

    corners.forEach((c, i) => {
      const r = Math.max(scanCanvas.width, scanCanvas.height) * 0.018;
      const circle = document.createElementNS(ns, 'circle');
      circle.setAttribute('cx', c.x);
      circle.setAttribute('cy', c.y);
      circle.setAttribute('r', Math.max(r, 10));
      circle.setAttribute('class', 'corner-handle');
      circle.dataset.idx = i;
      scanSvgOverlay.appendChild(circle);
    });
  }

  function svgPointFromEvent(evt){
    const pt = scanSvgOverlay.createSVGPoint();
    const touch = evt.touches ? evt.touches[0] : evt;
    pt.x = touch.clientX;
    pt.y = touch.clientY;
    const ctm = scanSvgOverlay.getScreenCTM().inverse();
    const transformed = pt.matrixTransform(ctm);
    return { x: transformed.x, y: transformed.y };
  }

  function handlePointerDown(evt){
    const target = evt.target;
    if(target.classList && target.classList.contains('corner-handle')){
      draggingCornerIdx = Number(target.dataset.idx);
      evt.preventDefault();
    }
  }
  function handlePointerMove(evt){
    if(draggingCornerIdx === null) return;
    evt.preventDefault();
    const p = svgPointFromEvent(evt);
    corners[draggingCornerIdx] = {
      x: Math.max(0, Math.min(scanCanvas.width, p.x)),
      y: Math.max(0, Math.min(scanCanvas.height, p.y))
    };
    drawOverlay();
  }
  function handlePointerUp(){
    draggingCornerIdx = null;
  }

  scanSvgOverlay.addEventListener('mousedown', handlePointerDown);
  scanSvgOverlay.addEventListener('touchstart', handlePointerDown, { passive:false });
  window.addEventListener('mousemove', handlePointerMove);
  window.addEventListener('touchmove', handlePointerMove, { passive:false });
  window.addEventListener('mouseup', handlePointerUp);
  window.addEventListener('touchend', handlePointerUp);

  document.getElementById('resetCornersBtn').addEventListener('click', ()=>{
    resetCornersToDefault();
    drawOverlay();
  });

  document.getElementById('scanRotateSrc').addEventListener('click', ()=>{
    scanSourceRotation = (scanSourceRotation + 90) % 360;
    layoutScanCanvas();
  });

  document.getElementById('scanCancel').addEventListener('click', ()=>{
    scanModal.classList.remove('open');
    scanImg = null;
    processNextInQueue();
  });

  // ---- Auto Detect using OpenCV.js (loaded lazily, on demand) ----
  const OPENCV_SOURCES = [
    'https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.9.0-release.1/dist/opencv.js',
    'https://unpkg.com/@techstark/opencv-js@4.9.0-release.1/dist/opencv.js',
    'https://docs.opencv.org/4.9.0/opencv.js'
  ];
  let cvLoadPromise = null;

  function loadScriptOnce(src, timeoutMs){
    return new Promise((resolve, reject)=>{
      const script = document.createElement('script');
      let settled = false;
      const finish = (ok, err) => {
        if(settled) return;
        settled = true;
        clearInterval(pollTimer);
        clearTimeout(timer);
        if(ok) resolve(); else reject(err || new Error('failed'));
      };
      const timer = setTimeout(()=> finish(false, new Error('timeout loading '+src)), timeoutMs);
      // Poll for a real, usable cv.Mat regardless of how the build exposes readiness
      const pollTimer = setInterval(()=>{
        if(window.cv && window.cv.Mat){ finish(true); }
      }, 100);
      script.src = src;
      script.async = true;
      script.onload = () => {
        // Some builds are ready immediately; others need a tick or onRuntimeInitialized
        if(window.cv && window.cv.Mat){ finish(true); return; }
        if(window.cv && typeof window.cv === 'object'){
          window.cv.onRuntimeInitialized = () => finish(true);
        }
        // otherwise the pollTimer above will catch it once cv.Mat appears
      };
      script.onerror = () => finish(false, new Error('failed to load '+src));
      document.head.appendChild(script);
    });
  }

  function waitForCv(timeoutMs){
    if(window.cv && window.cv.Mat){
      return Promise.resolve();
    }
    if(cvLoadPromise) return cvLoadPromise;

    cvLoadPromise = (async () => {
      let lastErr = null;
      for(const src of OPENCV_SOURCES){
        try{
          await loadScriptOnce(src, timeoutMs);
          if(window.cv && window.cv.Mat) return;
        }catch(err){
          lastErr = err;
          console.warn('OpenCV source failed:', src, err.message);
        }
      }
      cvLoadPromise = null; // allow retry next time
      throw lastErr || new Error('All OpenCV sources failed');
    })();

    return cvLoadPromise;
  }

  function orderCorners(pts){
    // pts: array of 4 {x,y}. Return ordered TL, TR, BR, BL
    const sum = pts.map(p => p.x + p.y);
    const diff = pts.map(p => p.x - p.y);
    const tl = pts[sum.indexOf(Math.min(...sum))];
    const br = pts[sum.indexOf(Math.max(...sum))];
    const tr = pts[diff.indexOf(Math.max(...diff))];
    const bl = pts[diff.indexOf(Math.min(...diff))];
    return [tl, tr, br, bl];
  }

  async function runAutoDetect(){
    autoDetectBtn.disabled = true;
    scanStatus.innerHTML = '<span class="spinner"></span> Loading detector...';
    try{
      await waitForCv(20000);
      scanStatus.innerHTML = '<span class="spinner"></span> Detecting edges...';
      const cv = window.cv;
      const src = cv.imread(scanCanvas);
      const gray = new cv.Mat();
      cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
      const blurred = new cv.Mat();
      cv.GaussianBlur(gray, blurred, new cv.Size(5,5), 0);
      const edged = new cv.Mat();
      cv.Canny(blurred, edged, 50, 150);
      const dilated = new cv.Mat();
      const kernel = cv.Mat.ones(3,3, cv.CV_8U);
      cv.dilate(edged, dilated, kernel);

      const contours = new cv.MatVector();
      const hierarchy = new cv.Mat();
      cv.findContours(dilated, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

      let bestQuad = null;
      let bestArea = 0;
      const imgArea = src.rows * src.cols;

      for(let i = 0; i < contours.size(); i++){
        const cnt = contours.get(i);
        const peri = cv.arcLength(cnt, true);
        const approx = new cv.Mat();
        cv.approxPolyDP(cnt, approx, 0.02 * peri, true);
        if(approx.rows === 4){
          const area = Math.abs(cv.contourArea(approx));
          if(area > bestArea && area > imgArea * 0.15){
            bestArea = area;
            if(bestQuad) bestQuad.delete();
            bestQuad = approx;
          } else {
            approx.delete();
          }
        } else {
          approx.delete();
        }
        cnt.delete();
      }

      if(bestQuad){
        const pts = [];
        for(let i = 0; i < 4; i++){
          pts.push({ x: bestQuad.intPtr(i,0)[0], y: bestQuad.intPtr(i,0)[1] });
        }
        corners = orderCorners(pts);
        drawOverlay();
        scanStatus.textContent = 'Edges detected — drag corners to fine-tune if needed';
        bestQuad.delete();
      } else {
        scanStatus.textContent = 'Could not find a clear edge — please adjust corners manually';
      }

      src.delete(); gray.delete(); blurred.delete(); edged.delete();
      dilated.delete(); kernel.delete(); contours.delete(); hierarchy.delete();
    }catch(err){
      console.error(err);
      scanStatus.textContent = 'Auto detect unavailable right now — please adjust corners manually';
    }finally{
      autoDetectBtn.disabled = false;
      setTimeout(()=>{ if(scanStatus.textContent.indexOf('detected') === -1) scanStatus.textContent=''; }, 3500);
    }
  }

  autoDetectBtn.addEventListener('click', runAutoDetect);

  // ---- Perspective warp using OpenCV.js ----
  function dist(a,b){
    return Math.hypot(a.x-b.x, a.y-b.y);
  }

  async function applyPerspectiveWarp(){
    const [tl, tr, br, bl] = corners;
    const widthTop = dist(tl, tr);
    const widthBottom = dist(bl, br);
    const heightLeft = dist(tl, bl);
    const heightRight = dist(tr, br);
    const outW = Math.max(Math.round(Math.max(widthTop, widthBottom)), 50);
    const outH = Math.max(Math.round(Math.max(heightLeft, heightRight)), 50);

    try{
      await waitForCv(20000);
      const cv = window.cv;
      const src = cv.imread(scanCanvas);
      const dst = new cv.Mat();
      const dsize = new cv.Size(outW, outH);

      const srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
        tl.x, tl.y, tr.x, tr.y, br.x, br.y, bl.x, bl.y
      ]);
      const dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
        0, 0, outW, 0, outW, outH, 0, outH
      ]);
      const M = cv.getPerspectiveTransform(srcTri, dstTri);
      cv.warpPerspective(src, dst, M, dsize, cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());

      const outCanvas = document.createElement('canvas');
      outCanvas.width = outW;
      outCanvas.height = outH;
      cv.imshow(outCanvas, dst);

      src.delete(); dst.delete(); srcTri.delete(); dstTri.delete(); M.delete();

      return outCanvas.toDataURL('image/jpeg', 0.92);
    }catch(err){
      console.error('Perspective warp failed, falling back to simple crop', err);
      // Fallback: no OpenCV available — just do a straight bounding-box crop, no perspective correction
      const xs = corners.map(c=>c.x), ys = corners.map(c=>c.y);
      const minX = Math.max(0, Math.min(...xs));
      const minY = Math.max(0, Math.min(...ys));
      const maxX = Math.min(scanCanvas.width, Math.max(...xs));
      const maxY = Math.min(scanCanvas.height, Math.max(...ys));
      const cw = Math.max(1, maxX - minX), ch = Math.max(1, maxY - minY);
      const outCanvas = document.createElement('canvas');
      outCanvas.width = cw; outCanvas.height = ch;
      const ctx = outCanvas.getContext('2d');
      ctx.drawImage(scanCanvas, minX, minY, cw, ch, 0, 0, cw, ch);
      return outCanvas.toDataURL('image/jpeg', 0.92);
    }
  }

  document.getElementById('applyCropBtn').addEventListener('click', async ()=>{
    const applyBtn = document.getElementById('applyCropBtn');
    applyBtn.disabled = true;
    scanStatus.innerHTML = '<span class="spinner"></span> Flattening page...';
    try{
      const resultDataUrl = await applyPerspectiveWarp();
      croppedResultDataUrl = resultDataUrl;
      reviewImg.src = resultDataUrl;
      scanModal.classList.remove('open');
      reviewModal.classList.add('open');
      scanStatus.textContent = '';
    }catch(err){
      console.error(err);
      showToast('Could not process image, try adjusting corners');
    }finally{
      applyBtn.disabled = false;
    }
  });

  // ---- Review screen actions ----
  function acceptScannedPage(){
    pages.push({ id: idCounter++, dataUrl: croppedResultDataUrl, rotation: 0, name: currentScanName });
    reviewModal.classList.remove('open');
    croppedResultDataUrl = null;
    scanImg = null;
    render();
    showToast('Page added');
    processNextInQueue();
  }

  document.getElementById('reviewAccept').addEventListener('click', acceptScannedPage);
  document.getElementById('reviewAcceptBottom').addEventListener('click', acceptScannedPage);

  document.getElementById('reviewBack').addEventListener('click', ()=>{
    reviewModal.classList.remove('open');
    scanModal.classList.add('open');
  });
  document.getElementById('reviewDiscard').addEventListener('click', ()=>{
    reviewModal.classList.remove('open');
    croppedResultDataUrl = null;
    scanImg = null;
    processNextInQueue();
  });

  window.addEventListener('resize', ()=>{
    if(scanModal.classList.contains('open') && scanImg){
      layoutScanCanvas();
    }
  });

  render();
})();
</script>

</body>
